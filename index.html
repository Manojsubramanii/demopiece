let LOADS={
 "LD-1042":{date:"18-Nov-2026",lines:[["AR Stores","Anna Nagar","r1",40],["AR Stores","Anna Nagar","o1",12],["AR Stores","Anna Nagar","d1",5],["AR Stores","Anna Nagar","t1",4],["Sri Murugan Traders","Simmakkal","r1",25],["Sri Murugan Traders","Simmakkal","g1",10],["Sri Murugan Traders","Simmakkal","o2",6],["Sri Murugan Traders","Simmakkal","l1",8],["Lakshmi Provisions","KK Nagar","r2",30],["Lakshmi Provisions","KK Nagar","g3",8],["Lakshmi Provisions","KK Nagar","r4",12],["Lakshmi Provisions","KK Nagar","t1",6],["Annamalai Mart","Thirunagar","g2",14],["Annamalai Mart","Thirunagar","r3",18],["Annamalai Mart","Thirunagar","o1",10],["Annamalai Mart","Thirunagar","r4",8],["Annamalai Mart","Thirunagar","l1",10],["Kumar General Stores","Pasumalai","r1",20],["Kumar General Stores","Pasumalai","g1",6],["Kumar General Stores","Pasumalai","d2",4],["AR Stores","Anna Nagar","r5",50],["Lakshmi Provisions","KK Nagar","g4",30],["Kumar General Stores","Pasumalai","d3",5],["Annamalai Mart","Thirunagar","o3",24]]},

// Load the translation workbook from the same website folder as this HTML file.
// Expected filename: tamil-translations.xlsx (columns: English, Tamil).
async function loadTamilTranslations(){
 try{
  if(!window.XLSX)throw new Error("Excel reader library is unavailable");
  const response=await fetch("./tamil-translations.xlsx",{cache:"no-cache"});
  if(!response.ok)throw new Error("tamil-translations.xlsx was not found (HTTP "+response.status+")");
  const bytes=await response.arrayBuffer();
  const workbook=XLSX.read(bytes,{type:"array"});
  const sheet=workbook.Sheets[workbook.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(sheet,{header:1,defval:"",raw:false});
  if(!rows.length)throw new Error("The translation workbook is empty");
  const headers=rows[0].map(v=>String(v).trim().toLowerCase());
  const en=headers.findIndex(v=>["english","english name","source","product","product name"].includes(v));
  const ta=headers.findIndex(v=>["tamil","tamil name","translation","translated name"].includes(v));
  if(en<0||ta<0)throw new Error("The workbook needs English and Tamil column headings");
  const map={};
  rows.slice(1).forEach(row=>{
   const english=String(row[en]??"").trim();
   const tamil=String(row[ta]??"").trim();
   if(english&&tamil)map[english]=tamil;
  });
  translations=map;
  const note=document.getElementById("sync");
  if(note)note.textContent="Tamil translations loaded: "+Object.keys(map).length+" entries.";
  if(language==="ta")render();
 }catch(error){
  translations={};
  const note=document.getElementById("sync");
  if(note)note.textContent="Tamil translation file not loaded. Missing translations will remain in English. Details: "+error.message;
 }
}

 else if(b.id==="ask"){S.ask=true;render()}else if(b.id==="no"){S.ask=false;render()}
 else if(b.id==="yes"){done[S.load]=new Date().toLocaleString("en-IN",{dateStyle:"medium",timeStyle:"short"});saveProgress();S.ask=false;render()}
 else if(d.pr){const bs=document.querySelectorAll(".bill");document.body.classList.add("pb");bs.forEach((x,i)=>x.classList.toggle("pr",d.pr==="all"||+d.pr===i));window.print()}};

<script>
// Firebase backend (Firestore only, no sign-in). Does nothing until FIREBASE_CONFIG at the top of this file is filled in.
// Your Firestore rules must allow read and write on salesSupport/{doc}.
(async()=>{
 const C=window.FIREBASE_CONFIG||{},CLOUD=window.CLOUD,$=id=>document.getElementById(id);
 if(!C.apiKey||!C.projectId||/^YOUR_/.test(C.apiKey))return;
 const B="https://www.gstatic.com/firebasejs/12.4.0/";
 let App,FS;
 try{[App,FS]=await Promise.all([import(B+"firebase-app.js"),import(B+"firebase-firestore.js")])}
 catch(e){console.error(e);CLOUD.say("⚠ Cloud sync could not start (no internet?). Saved on this device only.");return}
 const app=App.initializeApp(C);
 const db=FS.initializeFirestore(app,{localCache:FS.persistentLocalCache({tabManager:FS.persistentMultipleTabManager()})});
 const ref=k=>FS.doc(db,"salesSupport",k);
 const say=t=>{$("sync").textContent=t};
 CLOUD.on=true;
 // Each document holds one JSON string (Firestore does not allow arrays inside arrays)
 CLOUD.push=(k,o)=>{
  (o===null?FS.deleteDoc(ref(k)):FS.setDoc(ref(k),{json:JSON.stringify(o),updatedAt:FS.serverTimestamp()})).catch(e=>say("⚠ Could not save to the cloud: "+e.code))};
 say("☁ Connecting to the cloud…");
 const first={};
 ["data","progress"].forEach(k=>FS.onSnapshot(ref(k),s=>{
  if(s.metadata.hasPendingWrites)return;
  if(!s.metadata.fromCache)say("☁ Saved to the cloud");
  if(s.exists()){try{window.cloudIn(k,JSON.parse(s.data().json))}catch(x){console.error(x)}}
  else if(!first[k]){const o=window.cloudLocal(k);if(o)CLOUD.push(k,o)}
  first[k]=1;
 },e=>say(e.code==="permission-denied"?"⚠ Cloud blocked: your Firestore rules do not allow read and write on salesSupport. Saved on this device only.":(e.code==="not-found"||e.code==="unavailable")?"⚠ Cannot reach the Firestore database for project "+C.projectId+". Check that it has been created in the Firebase console. Saved on this device only.":"⚠ Cloud error: "+e.code+". Saved on this device only.")));
})();
</script>
