<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sales Support – Pick List, Confirm and Bill</title>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&family=Noto+Sans+Tamil:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#fffbf1;--sf:#fffffc;--ink:#2e1b1b;--mu:#7d6761;--ln:#eadfca;--ac:#7b1e2b;--acs:#f8ebe4;--ok:#2f7a3f;--oks:#e8f2df}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Public Sans","Noto Sans Tamil",system-ui,sans-serif}
button,select,input{font:inherit;color:var(--ink)}
h1,h2{font-family:Georgia,serif;margin:0}
.wrap{max-width:960px;margin:0 auto;padding:0 16px}
.sub{color:var(--mu);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{height:46px;padding:0 16px;border-radius:10px;border:1px solid var(--ln);background:var(--sf);cursor:pointer;font-weight:600}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
header{background:#6b1624;color:#fff3e4}
header .wrap{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding-top:12px;padding-bottom:12px}
header .sub{color:#fff3e4}
header select{height:46px;border-radius:10px;border:2px solid #e9c9c0;padding:0 10px;font-weight:600;background:var(--sf);max-width:100%}
header .btn{background:#fff7ea;color:#6b1624}
.steps{display:flex;gap:8px;margin:16px 0}
.step{flex:1;padding:12px;border:1px solid var(--ln);border-radius:10px;background:var(--sf);cursor:pointer;font-weight:600}
.step[aria-current=true]{border-color:var(--ac);box-shadow:inset 0 0 0 1px var(--ac);color:var(--ac)}
.step.done{background:var(--oks)}
.step:disabled{opacity:.5;cursor:not-allowed}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tab{padding:10px;border:2px solid var(--ln);border-radius:12px;background:var(--sf);cursor:pointer;text-align:left}
.tab b{display:block}
.tab[aria-selected=true]{border-color:var(--ac);background:var(--acs)}
.pkb{margin-top:14px;background:var(--ac);color:#fff;border-radius:12px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;margin-top:12px;overflow:hidden}
.ch{padding:12px 14px;background:var(--acs)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 12px;text-align:left;border-top:1px solid var(--ln)}
th{font-size:13px;color:var(--mu)}
.n{text-align:right!important;white-space:nowrap}
tr.cg td{background:var(--bg);font-size:13px;font-weight:700;text-transform:uppercase;color:var(--mu)}
tr.t{cursor:pointer}
tr.ok td{background:var(--oks)}
.ik{width:24px;height:24px;accent-color:var(--ok)}
tfoot td{font-weight:700}
.panel,.warn,.ban{padding:14px;border-radius:12px;margin-top:12px}
.panel{background:var(--sf);border:1px solid var(--ln)}
.warn{background:var(--acs)}
.ban{background:var(--oks);color:var(--ok);font-weight:600;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.bar{margin-top:14px;justify-content:flex-end}
.note{font-size:12px;color:var(--mu);margin:18px 0 30px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;padding:16px}
.fl{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--mu)}
.fl select{height:44px;border:2px solid var(--ln);border-radius:10px;padding:0 8px;font-weight:600}
.bill{padding:18px}
.bill td,.bill th{border:1px solid var(--ln)}
.inv-h{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:10px;border-bottom:3px solid var(--ac);margin-bottom:12px}
.inv-f{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px}
.inv-f .wd{flex:1;min-width:200px}
.tot{width:min(300px,100%)}
.tot div{display:flex;justify-content:space-between;padding:3px 0}
.tot .g{border-top:2px solid var(--ink);margin-top:4px;padding-top:8px;font-size:18px;font-weight:700}
.sig{display:flex;justify-content:space-between;margin-top:40px;font-size:13px;color:var(--mu);text-align:center}
.sig span{border-top:1px solid var(--ln);padding-top:6px;min-width:140px}
.stats{display:flex;gap:10px;margin-top:14px}
.stat{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:10px 14px}
.stat b{display:block;font-size:22px}
.chk{margin-top:12px;padding:14px 16px;border-radius:14px;background:var(--sf);border:1px solid var(--ln)}
.chk-t{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:18px}
.chk-t b{font-size:30px;color:var(--ac)}
.prog{height:12px;background:var(--ln);border-radius:99px;overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ok));transition:width .3s}
tr.t td{padding:16px 12px}
tr.t .ik{width:32px;height:32px}
tr.t:not(.ok) td:first-child{border-left:5px solid var(--ac)}
tr.ok td:first-child{border-left:5px solid var(--ok)}
tr.ok td b{color:var(--ok)}
.btn.big{height:54px;font-size:18px;padding:0 26px}
.btn.p:not(:disabled){box-shadow:0 4px 14px rgba(123,30,43,.35)}
.modal{position:fixed;inset:0;background:rgba(30,10,10,.55);display:grid;place-items:center;padding:16px;z-index:50;animation:fd .2s}
.mbox{background:var(--sf);border-radius:18px;padding:28px 24px;max-width:420px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4);animation:pop .25s}
.mic{width:64px;height:64px;border-radius:50%;background:var(--ok);color:#fff;font-size:34px;display:grid;place-items:center;margin:0 auto 12px}
@keyframes fd{from{opacity:0}}@keyframes pop{from{transform:scale(.85);opacity:0}}
@media(max-width:640px){.bar{position:sticky;bottom:0;background:var(--bg);padding:10px 0;margin:0}.bar .btn{flex:1}.sig span{min-width:0;flex:1}}
@media print{body{background:#fff}header,.steps,.note,.noprint{display:none!important}.card{break-inside:avoid}body.pb .bill:not(.pr){display:none}}
</style></head><body>
<header><div class="wrap">
 <div><h1>Sales Support</h1><div class="sub" id="meta"></div></div>
 <div class="row"><select id="load" aria-label="Select loading"></select><button class="btn" id="lang">தமிழ்</button><button class="btn" id="sv">🗂 Saved bills</button><button class="btn" id="imp">📥 Import</button></div>
</div></header>
<main class="wrap"><nav class="steps" id="steps"></nav><div id="view"></div><p class="note" id="msg"></p></main>
<script>
/* ---------- Setup ---------- */
// Pickup 1 = bagged rice/grocery/linga, Pickup 2 = oil and dry-fruit boxes, Pickup 3 = loose items and the rest.
const PICKUPS=[{n:"Pickup 1",sub:"Rice, Groceries & Linga (bags)",cats:["Rice","Rice 2","Grocery","Linga"]},
 {n:"Pickup 2",sub:"Oil Box, Oil Tin & Dry Fruit boxes",cats:["Oil Box","Oil Tin","Dry Fruits"]},
 {n:"Pickup 3",sub:"Loose kg / pieces, Tiger and the rest"}];
const ROUTE=["Anna Nagar","Simmakkal","KK Nagar","Thirunagar","Pasumalai"];   // delivery order of areas
const CAT_ORDER=["Rice","Grocery","Dry Fruits","Oil Box","Oil Tin","Linga","Tiger","Rice 2"];
const APPCATS=[...CAT_ORDER,"Other"];
// Product: [name, category, unit, kg per unit, rate ₹, GST %, pieces per unit]
const SAMPLE={
 P:{r1:["Ponni Rice 25 kg","Rice","bag",25,1350,5,1],g1:["Toor Dal 30 kg","Grocery","bag",30,3300,0,1],o1:["Sunflower Oil 1 L (carton of 12)","Oil Box","carton",11,1320,5,12],o2:["Groundnut Oil 15 L tin","Oil Tin","tin",14,2400,5,1],d1:["Cashew 1 kg (carton of 10)","Dry Fruits","carton",10,7500,5,10],t1:["Tiger Item (carton of 10)","Tiger","carton",10,900,5,10],r5:["Rice Loose (per kg)","Rice","kg",1,52,5,1]},
 LOADS:{"LD-1042":{date:"18-Nov-2026",lines:[["AR Stores","Anna Nagar","r1",40],["AR Stores","Anna Nagar","o1",12],["AR Stores","Anna Nagar","d1",5],["AR Stores","Anna Nagar","r5",50],["Sri Murugan Traders","Simmakkal","r1",25],["Sri Murugan Traders","Simmakkal","g1",10],["Sri Murugan Traders","Simmakkal","o2",6],["Lakshmi Provisions","KK Nagar","t1",6]]}}};

/* ---------- Storage (this browser only, no database) ---------- */
const $=id=>document.getElementById(id);
const get=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const put=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const saved=get("ss_data",null);
let P=saved?.P||SAMPLE.P, LOADS=saved?.LOADS&&Object.keys(saved.LOADS).length?saved.LOADS:SAMPLE.LOADS;
let TA=get("ss_ta",{});                       // normalised English name -> Tamil name
let done=get("ss_confirmed",{}), ticks=get("ss_ticks",{});
const S={load:Object.keys(LOADS)[0],step:1,pk:0,ask:false,lang:"ta"};
let IMP=null;
const saveProgress=()=>{put("ss_confirmed",done);put("ss_ticks",ticks)};

/* ---------- Helpers ---------- */
const norm=s=>String(s).toLowerCase().replace(/\s+/g," ").trim();
const lk=s=>String(s).toLowerCase().replace(/[^a-z0-9\u0b80-\u0bff]/g,"");
const TAMIL=/[\u0b80-\u0bff]/;
/* Tamil names Excel: one column in Tamil script, one column in English letters (Tanglish).
   The sales sheet spells names differently from the Tanglish column, so names are matched by sound:
   same size (26 KG, 1 L, 500 ML) + similar consonants. Names with no close match stay in English. */
const UNIT=/(\d+(?:\.\d+)?(?:\/\d+)?)\s*(kgs?|ml|ltrs?|litres?|l|gm?)\b/g;
const sizeOf=s=>{const o=[],t=String(s).toLowerCase();t.replace(UNIT,(m,n,u)=>{o.push(n+(u[0]==="k"?"kg":u==="ml"?"ml":u[0]==="g"?"g":"l"))});const g=t.match(/(\d+)\s*no\b/);if(g)o.push("no"+g[1]);return o.sort().join(",")};
const phon=s=>{let t=String(s).toLowerCase().replace(UNIT," ").replace(/\b\d+\s*no\b/g," ").replace(/\b(bags?|box(es)?|tins?|pcs?|pieces?|pouch|pounch|bottle|kgs?|litre|ltr)\b/g," ").replace(/[^a-z ]/g,"");
 [["zh","l"],["ph","p"],["ch","c"],["aa","a"],["ee","i"],["oo","u"],["th","t"],["ng","n"],["dd","d"],["kk","k"],["tt","t"],["pp","p"],["ll","l"],["nn","n"],["rr","r"],["v","w"],["y","i"]].forEach(([x,y])=>t=t.split(x).join(y));
 return t.replace(/[aeiou ]/g,"")};
const sim=(a,b)=>{if(!a||!b)return 0;const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;
 for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return 1-d[a.length][b.length]/Math.max(a.length,b.length)};
const PACK=/\b(bags?|box(es)?|tins?|pcs?|pieces?)\s*$/i;
const withPack=(ta,p)=>{const m=String(p).match(PACK);return m&&PACK.test(ta)?ta.replace(PACK,m[1].toUpperCase()):ta};   // show the bill's own BAG / BOX / PIECE
let IDX=null;
function tindex(){
 if(IDX&&IDX.src===TA)return IDX;
 const exact={},list=[];
 Object.entries(TA).forEach(([en,ta])=>{exact[lk(en)]=ta;if(TAMIL.test(ta))list.push({ta,sz:sizeOf(en),ph:phon(en)})});
 return IDX={src:TA,exact,list,cache:{}};
}
function tlook(s){
 const x=tindex();if(s in x.cache)return x.cache[s];
 let r=x.exact[lk(s)]||"";
 if(!r){const sz=sizeOf(s),ph=phon(s);let best=null,bs=0;
  x.list.forEach(e=>{if(e.sz!==sz)return;const v=sim(ph,e.ph);if(v>bs){bs=v;best=e}});
  if(best&&bs>=0.65)r=withPack(best.ta,s)}
 return x.cache[s]=r;
}
const tr=s=>S.lang==="ta"?(tlook(s)||s):s;       // Tamil if a translation exists, else the English name
const fmt=n=>n.toLocaleString("en-IN");
const rs=n=>"₹"+n.toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
const pl=(n,u)=>n+" "+u+(n>1?"s":"");
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
const num=v=>parseFloat(String(v).replace(/[^0-9.\-]/g,""))||0;
const cr=c=>{const i=CAT_ORDER.indexOf(c);return i<0?99:i};
const cmpl=(x,y)=>cr(x.cat)-cr(y.cat)||x.cat.localeCompare(y.cat)||x.name.localeCompare(y.name);
const words=n=>{const a=["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"],b=["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"],t=x=>x<20?a[x]:b[x/10|0]+(x%10?" "+a[x%10]:""),h=x=>x>99?a[x/100|0]+" Hundred"+(x%100?" "+t(x%100):""):t(x);let r="";const c=n/1e7|0,l=n/1e5%100|0,k=n/1e3%100|0,m=n%1e3;if(c)r+=h(c)+" Crore ";if(l)r+=t(l)+" Lakh ";if(k)r+=t(k)+" Thousand ";if(m)r+=h(m);return(r.trim()||"Zero")+" Rupees Only"};

/* ---------- Data for the current loading ---------- */
const lines=()=>LOADS[S.load].lines.map(([shop,area,p,q,b])=>{const m=P[p],amt=q*m[4];return{b,shop,area,name:m[0],cat:m[1],unit:m[2],qty:q,wt:q*m[3],rate:m[4],gst:m[5],amt,tax:amt*m[5]/100}}).sort(cmpl);
const conf=()=>done[S.load];
const loose=u=>/^(kgs?|pcs?|pieces?|nos?)$/i.test(String(u).trim());
const inPk=(i,x)=>{const a=!loose(x.unit)&&PICKUPS[0].cats.includes(x.cat),b=!loose(x.unit)&&PICKUPS[1].cats.includes(x.cat);return i===0?a:i===1?b:!a&&!b};
function totals(){const m={};lines().forEach(l=>{const o=m[l.name]=m[l.name]||{name:l.name,cat:l.cat,unit:l.unit,qty:0,wt:0};o.qty+=l.qty;o.wt+=l.wt});return Object.values(m)}
const shopRank=(a,s)=>{const i=ROUTE.indexOf(a);return(i<0?99:i)};
function pkItems(i){
 if(i===2){const m={};lines().filter(l=>inPk(2,l)).forEach(l=>{const k=l.shop+"|"+l.name,o=m[k]=m[k]||{shop:l.shop,area:l.area,name:l.name,cat:l.cat,unit:l.unit,qty:0,wt:0};o.qty+=l.qty;o.wt+=l.wt});
  return Object.values(m).sort((a,b)=>shopRank(a.area)-shopRank(b.area)||a.shop.localeCompare(b.shop)||cmpl(a,b))}
 return pkItems1(i)}
const pkItems1=i=>totals().filter(x=>inPk(i,x)).sort((a,b)=>i<2?PICKUPS[i].cats.indexOf(a.cat)-PICKUPS[i].cats.indexOf(b.cat)||a.name.localeCompare(b.name):cmpl(a,b));
const kOf=x=>S.load+"|"+(x.shop?x.shop+"|":"")+x.name;
const kg=it=>it.reduce((a,x)=>a+x.wt,0);
const shopsOf=a=>{const rk=s=>{const i=ROUTE.indexOf(a.find(l=>l.shop===s).area);return i<0?99:i};return[...new Set(a.map(l=>l.shop))].sort((x,y)=>rk(x)-rk(y))};

/* ---------- Views ---------- */
function stepper(){
 const c=!!conf();
 $("steps").innerHTML=[["Pick list",1],["Check & confirm",2],["Make bills",3]].map(([t,n])=>`<button class="step ${n<3&&c?"done":""}" data-n="${n}" ${n===3&&!c?"disabled":""} aria-current="${S.step===n}">${n<3&&c?"✓ ":""}${t}${n===3&&!c?" (confirm first)":""}</button>`).join("");
}
function tabs(tk){
 return`<div class="tabs noprint">${PICKUPS.map((p,i)=>{const it=pkItems(i),nt=it.filter(x=>ticks[kOf(x)]).length;
  return`<button class="tab" data-t="${i}" aria-selected="${S.pk===i}"><b>${p.n}${tk&&it.length&&nt===it.length?" ✓":""}</b><span class="sub">${tk?`${nt} of ${it.length} ticked`:`${pl(it.length,"product")} · ${fmt(kg(it))} kg`}</span></button>`}).join("")}</div>`;
}
function pickup(i,tk,pr){
 const p=PICKUPS[i],it=pkItems(i);let cat="",rows="";
 it.forEach(x=>{
  const grp=i===2?x.shop:x.cat;
  if(grp!==cat){cat=grp;rows+=`<tr class="cg"><td colspan="4">${esc(i===2?x.shop+" · "+x.area:tr(cat))}</td></tr>`}
  const k=kOf(x),on=tk&&ticks[k];
  rows+=`<tr class="${tk?"t ":""}${on?"ok":""}" ${tk?`data-k="${esc(k)}"`:""}><td>${tk?`<input type="checkbox" class="ik" data-k="${esc(k)}" ${on?"checked":""}>`:""}</td><td><b>${esc(tr(x.name))}</b></td><td class="n"><b>${pl(x.qty,x.unit)}</b></td><td class="n">${fmt(x.wt)} kg</td></tr>`});
 return`<div class="pkb"><div><h2>${p.n}</h2><div class="sub" style="color:#fff">${p.sub}</div></div><div class="row"><span>${pl(it.length,"product")} · ${fmt(kg(it))} kg</span></div></div>
 ${it.length?`<section class="card"><div class="tw"><table><tbody>${rows}</tbody><tfoot><tr><td></td><td>Total</td><td></td><td class="n">${fmt(kg(it))} kg</td></tr></tfoot></table></div></section>`:`<div class="panel sub">Nothing in ${p.n} for this loading.</div>`}`;
}
const v1=()=>tabs(false)+pickup(S.pk,false,true)+`<div class="row bar noprint"><button class="btn p" data-go="2">${conf()?"View confirmation":"Next: Confirm loading"}</button></div>`;
function v2(){
 const all=PICKUPS.flatMap((_,i)=>pkItems(i)),nt=all.filter(x=>ticks[kOf(x)]).length,pc=all.length?Math.round(nt/all.length*100):0,ready=all.length>0&&nt===all.length;
 const head=conf()?`<div class="ban"><span>✓ Loading ${S.load} confirmed on ${conf()}</span><button class="btn p" data-go="3">Open bills</button></div>`
  :`<div class="chk"><div class="chk-t"><span><b>${nt}</b> / ${all.length} items checked</span><span class="sub">${ready?"All checked – confirm the loading":"Tick every item as it is loaded"}</span></div><div class="prog"><i style="width:${pc}%"></i></div></div>`;
 const act=conf()?"":`<div class="row bar"><button class="btn" data-go="1">Back to pick list</button><button class="btn p big" id="ask" ${ready?"":"disabled"}>✓ Confirm loading</button></div>`;
 const modal=S.ask?`<div class="modal" id="mdl"><div class="mbox" role="dialog" aria-modal="true"><div class="mic">✓</div><h2>Confirm loading ${S.load}?</h2><p class="sub">${all.length} items checked · ${fmt(kg(all))} kg · ${LOADS[S.load].date}</p><p>After this the pick list is final and the bills will open.</p><div class="row" style="justify-content:center"><button class="btn" id="no">Cancel</button><button class="btn p" id="yes">Yes, confirm &amp; show bills</button></div></div></div>`:"";
 return`<h2>Check loading</h2>`+head+tabs(!conf())+pickup(S.pk,!conf(),false)+act+modal;
}
function makeBills(){
 const a=lines(),no=S.load.replace("LD","INV");
 return shopsOf(a).map((sh,i)=>{const ls=a.filter(l=>l.shop===sh),sub=ls.reduce((x,l)=>x+l.amt,0),tax=ls.reduce((x,l)=>x+l.tax,0);
  return{invoice:no+"-"+String(i+1).padStart(2,"0"),shop:sh,area:ls[0].area,refs:[...new Set(ls.map(l=>l.b).filter(Boolean))].join(", ")||"–",weight:ls.reduce((x,l)=>x+l.wt,0),subtotal:sub,tax,total:Math.round(sub+tax),
   items:ls.map(l=>({name:l.name,qty:l.qty,unit:l.unit,rate:l.rate,gst:l.gst,amount:l.amt}))}});
}
function billHtml(b,i,date,load){
 return`<section class="card bill"><div class="inv-h"><div><h2>Sales Support</h2><div class="sub">Tax Invoice</div></div><div class="n"><b>Invoice No: ${b.invoice}</b><div class="sub">Date: ${date} · Loading: ${load}</div></div></div>
 <div class="row" style="justify-content:space-between;margin-bottom:12px"><div><span class="sub">BILL TO</span><br><b>${esc(b.shop)}</b><div class="sub">${esc(b.area)}</div></div><div class="sub">Items: ${b.items.length}<br>Ref bill: ${esc(b.refs)}<br>Weight: ${fmt(b.weight)} kg</div></div>
 <div class="tw"><table><thead><tr><th>#</th><th>Product</th><th class="n">Qty</th><th class="n">Rate</th><th class="n">GST</th><th class="n">Amount</th></tr></thead><tbody>${b.items.map((l,j)=>`<tr><td>${j+1}</td><td>${esc(tr(l.name))}</td><td class="n">${pl(l.qty,l.unit)}</td><td class="n">${rs(l.rate)}</td><td class="n">${l.gst}%</td><td class="n"><b>${rs(l.amount)}</b></td></tr>`).join("")}</tbody></table></div>
 <div class="inv-f"><div class="wd"><span class="sub">AMOUNT IN WORDS</span><br><b>${words(b.total)}</b><div class="sub" style="margin-top:10px">Goods once sold will not be taken back.</div></div>

/* ---------- Excel reading ---------- */
function readSheet(file,cb,fail,all){
 if(!window.XLSX)return fail("The Excel reader could not load. Check your internet connection and reload.");
 const r=new FileReader();
 r.onload=()=>{try{const wb=XLSX.read(r.result,{type:"array"});cb((all?wb.SheetNames:[wb.SheetNames[0]]).flatMap(n=>XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:"",raw:false})))}catch(e){fail("Could not read this file. Use .xlsx, .xls or .csv.")}};
 r.readAsArrayBuffer(file);
}
// Tamil translations: first sheet, columns "English" and "Tamil" (or the first two columns)
function importTamil(file){
 readSheet(file,rows=>{
  const cnt=c=>rows.filter(r=>TAMIL.test(String(r[c]??""))).length,t=cnt(0)>=cnt(1)?0:1,e=1-t;
  if(!cnt(0)&&!cnt(1))return IMPMSG("No Tamil text found. Use one column with Tamil names and one column with English / Tanglish names.");
  const m={};let n=0;
  rows.forEach(r=>{const en=String(r[e]??"").trim(),ta=String(r[t]??"").trim();if(en&&ta&&TAMIL.test(ta)){m[en]=ta;n++}});
  TA=m;put("ss_ta",TA);IMPMSG(`✓ ${n} Tamil names read. Saving for everyone…`,true);
  cloud().then(c=>c.F.setDoc(c.F.doc(c.db,"salesSupportSettings","tamil"),{json:JSON.stringify(m),count:n,savedAt:Date.now()}))
   .then(()=>IMPMSG(`✓ ${n} Tamil names saved for all devices.`,true))
   .catch(err=>IMPMSG("⚠ Saved on this device only. "+cerr(err)));
 },IMPMSG,true);
}
function IMPMSG(t,ok){IMP=Object.assign(IMP||{},{tmsg:t,tok:!!ok});render()}
// Orders / loadings
const FIELDS=[["load","Loading no."],["date","Date"],["shop","Shop name *"],["area","Area / route"],["prod","Product name *"],["cat","Category"],["unit","Unit (bag / carton / tin)"],["qty","Quantity *"],["kg","Kg per unit"],["rate","Rate per unit (₹)"],["gst","GST %"],["pcs","Pieces per unit"],["bill","Bill no. (optional)"],["amt","Amount incl. tax (₹)"],["tax","Tax amount (₹)"]];
const KEYS={load:["load"],date:["date"],shop:["shop","party"],area:["area","route"],prod:["description","item name"],cat:["category"],unit:["uom"],qty:["qty","quantity"],kg:["kg per","weight"],rate:["rate","price"],gst:["gst"],pcs:["pieces per","pcs per"],bill:["bill no","invoice"],amt:["amount"],tax:["tax"]};
const EX={load:["loadno","loading","loadingno"],date:["billdate","date"],shop:["customername","shopname","shop","customer"],area:["areaname","area","route"],prod:["description","productname","itemname"],cat:["producttype","category"],unit:["unit","uom"],qty:["pcs","qty","quantity"],kg:["kgperunit"],rate:["itemrate","rate"],gst:["gst","gstpercent"],pcs:["piecesperunit"],bill:["billno","invoiceno"],amt:["amount"],tax:["totaltaxamount","taxamount"]};
const guessCat=r=>{const s=r.toLowerCase();return/rice/.test(s)?(/2/.test(s)?"Rice 2":"Rice"):/oil tin/.test(s)?"Oil Tin":/oil/.test(s)?"Oil Box":/dry/.test(s)?"Dry Fruits":/grocer/.test(s)?"Grocery":/linga/.test(s)?"Linga":/tiger/.test(s)?"Tiger":"Other"};
// Unit, kg and pieces from the product name when the file does not have them
const derive=d=>{const D=d.toUpperCase(),w=D.trim().split(/\s+/).pop(),k=(D.match(/(\d+(?:\.\d+)?)\s*KG/)||[])[1];
 if(w==="KG")return["kg",1,1];if(w==="BAG")return["bag",+k||0,1];if(w==="TIN")return["tin",14,1];if(w==="BOX")return["box",10,10];return["pcs",1,1]};
function importOrders(file){
 readSheet(file,d=>{
  const hi=d.slice(0,15).reduce((b,r,i)=>{const c=r.filter(x=>String(x).trim()).length;return c>b[0]?[c,i]:b},[0,0])[1];
  const hd=d[hi].map(x=>String(x).trim()),map={},used=new Set(),hn=hd.map(h=>h.toLowerCase().replace(/[^a-z0-9]/g,""));
  ["qty","kg","rate","gst","pcs","shop","area","prod","cat","unit","load","date","bill","amt","tax"].forEach(k=>{
   let i=-1;for(const w of EX[k]){i=hn.findIndex((h,j)=>h===w&&!used.has(j));if(i>=0)break}
   if(i<0)i=hd.findIndex((h,j)=>h&&!used.has(j)&&KEYS[k].some(w=>h.toLowerCase().includes(w)));
   if(i>=0)used.add(i);map[k]=i<0?"":String(i)});
  IMP=Object.assign(IMP||{},{name:file.name,hd,rows:d.slice(hi+1).filter(x=>x.some(c=>String(c).trim())),map,cm:{},err:null});render();
 },m=>{IMP=Object.assign(IMP||{},{err:m});render()});
}
function doImport(){
 const m=IMP.map,P2={},nl={},key={},old=n=>P[Object.keys(P).find(k=>P[k][0].toLowerCase()===n.toLowerCase())];
 IMP.rows.forEach(r=>{
  const g=f=>m[f]===""?"":String(r[+m[f]]??"").trim(),shop=g("shop"),prod=g("prod"),qty=num(g("qty"));
  if(!shop||!prod||!qty)return;
  const o=old(prod),dv=derive(prod),raw=g("cat"),cat=raw?(IMP.cm[raw]||guessCat(raw)):(o?o[1]:"Other");
  let rate,gst;
  if(m.amt!==""&&m.tax!==""){const a=num(g("amt")),t=num(g("tax")),b=a-t;rate=+(b/qty).toFixed(2);gst=t>0&&b>0?Math.round(t/b*100):0}
  else{rate=g("rate")!==""?num(g("rate")):(o?o[4]:0);gst=g("gst")!==""?num(g("gst")):(o?o[5]:0)}
  const unit=g("unit")||(o?o[2]:dv[0]),kgu=g("kg")!==""?num(g("kg")):(o?o[3]:dv[1]),pcs=g("pcs")!==""?num(g("pcs")):(o?o[6]:dv[2]),k=[prod,cat,unit,kgu,rate,gst,pcs].join("|");
  if(!key[k]){key[k]="p"+Object.keys(P2).length;P2[key[k]]=[prod,cat,unit,kgu,rate,gst,pcs]}
  const dt=g("date")||new Date().toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}).replace(/ /g,"-"),ld=g("load")||"LD-"+dt;
  (nl[ld]=nl[ld]||{date:dt,lines:[]}).lines.push([shop,g("area"),key[k],qty,g("bill")]);
 });
 if(!Object.keys(nl).length){IMP.err="No usable rows. Shop, Product and Quantity must be filled in the columns you chose.";return render()}
 P=P2;LOADS=nl;put("ss_data",{P,LOADS});
 Object.keys(nl).forEach(k=>{delete done[k];Object.keys(ticks).forEach(t=>{if(t.startsWith(k+"|"))delete ticks[t]})});
 saveProgress();Object.assign(S,{load:Object.keys(LOADS)[0],pk:0});IMP=null;go(1);
}
